<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HackMemo</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8eb;
    --muted: #9aa1ac;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }
  .app {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 48px);
  }
  header {
    padding: 12px 0 16px;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
  }
  header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 13px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: white;
  }
  .msg.bot {
    align-self: flex-start;
    background: #232733;
    color: var(--text);
  }
  form {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
  }
  button {
    padding: 12px 18px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>HackMemo</h1>
      <p>Assistente de memória para os hackathons. Ele lembra do que você conta.</p>
    </header>
    <div id="messages"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Conte algo ou pergunte..." autocomplete="off" />
      <button id="chat-submit" type="submit">Enviar</button>
    </form>
  </div>

  <script>
    const STORAGE_KEY = "hackmemo_user_id";
    function getUserId() {
      let id = localStorage.getItem(STORAGE_KEY);
      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem(STORAGE_KEY, id);
      }
      return id;
    }

    const messagesEl = document.getElementById("messages");
    const formEl = document.getElementById("chat-form");
    const inputEl = document.getElementById("chat-input");
    const submitEl = document.getElementById("chat-submit");

    function appendMessage(text, sender) {
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = inputEl.value.trim();
      if (!message) return;

      appendMessage(message, "user");
      inputEl.value = "";
      submitEl.disabled = true;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, userId: getUserId() }),
        });
        const data = await res.json();
        if (data.reply) {
          appendMessage(data.reply, "bot");
        } else {
          appendMessage("Erro: " + (data.error ?? "resposta inválida"), "bot");
        }
      } catch (err) {
        appendMessage("Erro de conexão. Tente novamente.", "bot");
      } finally {
        submitEl.disabled = false;
        inputEl.focus();
      }
    });
  </script>
</body>
</html>
